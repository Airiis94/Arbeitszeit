# Testet die App und stellt den Ordner app/ auf GitHub Pages bereit
# (HTTPS – Voraussetzung für Installation und Offline-Betrieb).
# Veröffentlicht wird automatisch vom Standard-Branch des Repositories.
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“.
name: Tests und Bereitstellung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit-Tests (Zeitkonto, Zustandsautomat, Backup, CSV, Service Worker)
        run: npm test
      - name: Playwright installieren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-Tests (IndexedDB, Unterpfad, Update, Import/Export, Offline)
        run: npm run test:e2e

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Service-Worker-Version aus dem Inhalt der App ableiten
        # Ändert sich eine App-Datei, ändert sich die Version → installierte Apps erkennen das Update.
        run: |
          HASH=$(find app -type f ! -name sw.js -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          sed -i "s/^const VERSION = '.*';/const VERSION = 'v1-${HASH}';/" app/sw.js
          grep -n "^const VERSION" app/sw.js
      # Schlägt fehl, solange Pages nicht aktiviert ist (Settings → Pages → Source: GitHub Actions);
      # die Pipeline darf Pages nicht selbst aktivieren.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
